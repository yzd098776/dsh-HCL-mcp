name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MCP_HCL_ALLOW_LIVE_WRITE: "0"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade build 'twine>=5'
      - name: Verify the tagged commit passes the software suite
        run: |
          python -m pip install -e '.[dev]' 'setuptools>=69'
          python scripts/check_all.py --receipt-root work/release-checks
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Write SHA-256 checksums
        run: |
          New-Item -ItemType Directory -Force checksums | Out-Null
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content checksums/SHA256SUMS.txt -Encoding ascii
          Get-Content checksums/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            checksums/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            checksums/
            work/release-checks/
          if-no-files-found: warn
          retention-days: 30

  npm:
    needs: build
    # Opt-in: set the repository variable NPM_PUBLISH=true and register this
    # repository as a trusted publisher for `dsh-mcp-hcl` on npmjs.com
    # (package Settings -> Trusted publishers -> GitHub Actions, workflow
    # `release.yml`). Publishing then uses OIDC, so no NPM_TOKEN secret is
    # needed. `npm stage publish` only stages the version; a maintainer
    # approves it in the npm web UI with a 2FA challenge before it goes live.
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage the bundle for npm (trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version
          npm stage publish

  pypi:
    needs: build
    # Opt-in: set the repository variable PYPI_PUBLISH=true after the trusted
    # publisher (project `mcp-hcl`, environment `pypi`) is configured on PyPI.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: .
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
